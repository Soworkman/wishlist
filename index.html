<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annie的心願要了清單</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700;900&display=swap');

        body {
            font-family: 'Noto Sans HK', sans-serif;
            background-color: #f0f9ff; /* sky-50 */
            background-image: url('data:image/svg+xml,%3Csvg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="none" fill-rule="evenodd"%3E%3Cg fill="%237dd3fc" fill-opacity="0.15"%3E%3Cpath d="M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');
        }

        .wish-item {
            transition: all 0.3s ease;
        }

        .wish-item:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .completed-item {
            opacity: 0.6;
            text-decoration: line-through;
            transform: scale(0.98);
        }

        /* 搞笑特效 CSS */
        .blessing-effect {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(45deg, #e0f2fe 0%, #bae6fd 99%, #bae6fd 100%);
            border: 4px solid #3b82f6;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .blessing-effect.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: fall 3s ease-in-out infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* 標題動畫 */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce-slow {
            animation: bounce 2s infinite;
        }
        
        .timer-box {
             background: rgba(255, 255, 255, 0.9);
             border: 2px dashed #3b82f6;
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 p-4 md:p-8">

    <div class="max-w-3xl mx-auto">
        
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-black text-blue-600 mb-2 animate-bounce-slow drop-shadow-md">
                <i class="fa-solid fa-wand-magic-sparkles mr-2 text-yellow-400"></i>
                <span class="name-display">Annie</span>的 <span class="text-cyan-500">心願要了</span> 清單
            </h1>
            <p class="text-lg text-gray-600 font-bold"><span class="dept-display">URS Office</span> 逃脫計劃 (最後衝刺！🏃‍♀️💨)</p>
        </header>

        <!-- Countdown Timer -->
        <div class="timer-box rounded-2xl p-6 mb-10 shadow-lg text-center transition-transform duration-300">
            <h2 class="text-xl font-bold text-gray-700 mb-4">距離 <span class="name-display">Annie</span> 自由解放 (Last Day) 還有：</h2>
            <div class="flex justify-center space-x-2 md:space-x-4">
                <div class="flex flex-col items-center">
                    <div id="days" class="text-4xl md:text-5xl font-black text-blue-500 bg-white border-2 border-blue-200 rounded-lg p-3 w-16 h-16 md:w-20 md:h-20 flex items-center justify-center shadow-inner">--</div>
                    <span class="text-sm font-bold mt-2 text-gray-500">日</span>
                </div>
                <div class="text-4xl md:text-5xl font-black text-blue-300 pt-3">:</div>
                <div class="flex flex-col items-center">
                    <div id="hours" class="text-4xl md:text-5xl font-black text-blue-500 bg-white border-2 border-blue-200 rounded-lg p-3 w-16 h-16 md:w-20 md:h-20 flex items-center justify-center shadow-inner">--</div>
                    <span class="text-sm font-bold mt-2 text-gray-500">時</span>
                </div>
                <div class="text-4xl md:text-5xl font-black text-blue-300 pt-3">:</div>
                <div class="flex flex-col items-center">
                    <div id="minutes" class="text-4xl md:text-5xl font-black text-blue-500 bg-white border-2 border-blue-200 rounded-lg p-3 w-16 h-16 md:w-20 md:h-20 flex items-center justify-center shadow-inner">--</div>
                    <span class="text-sm font-bold mt-2 text-gray-500">分</span>
                </div>
                <div class="text-4xl md:text-5xl font-black text-blue-300 pt-3">:</div>
                <div class="flex flex-col items-center">
                    <div id="seconds" class="text-4xl md:text-5xl font-black text-blue-500 bg-white border-2 border-blue-200 rounded-lg p-3 w-16 h-16 md:w-20 md:h-20 flex items-center justify-center shadow-inner">--</div>
                    <span class="text-sm font-bold mt-2 text-gray-500">秒</span>
                </div>
            </div>
            
            <div class="mt-6 flex flex-col sm:flex-row justify-center items-center gap-4 sm:gap-8">
               <div class="form-control flex flex-col items-center">
                   <label class="text-sm text-gray-500 font-bold mb-1">設定主角名稱:</label>
                   <input type="text" id="heroNameInput" value="Annie" class="border-2 border-blue-300 rounded p-1 text-center font-bold text-gray-700 bg-white focus:outline-none focus:border-blue-500 w-32">
               </div>
               <div class="form-control flex flex-col items-center">
                   <label class="text-sm text-gray-500 font-bold mb-1">設定部門名稱:</label>
                   <input type="text" id="deptNameInput" value="URS Office" class="border-2 border-blue-300 rounded p-1 text-center font-bold text-gray-700 bg-white focus:outline-none focus:border-blue-500 w-32">
               </div>
               <div class="form-control flex flex-col items-center">
                   <label class="text-sm text-gray-500 font-bold mb-1">設定 Last Day:</label>
                   <input type="date" id="targetDateInput" class="border-2 border-blue-300 rounded p-1 text-center font-bold text-gray-700 bg-white focus:outline-none focus:border-blue-500">
               </div>
            </div>
        </div>

        <!-- Wishlist Section -->
        <div class="bg-white rounded-3xl p-6 md:p-8 shadow-xl border-t-8 border-blue-400">
            <h2 class="text-2xl font-black text-gray-800 mb-6 flex items-center">
                <i class="fa-solid fa-list-check text-blue-500 mr-3"></i> 調職前必做/必食大清單
            </h2>

            <!-- Input area -->
            <div class="flex mb-6 gap-2">
                <input type="text" id="wishInput" placeholder="例如：食爆 Pantry 啲零食、叫腦細請食飯..." 
                       class="flex-1 border-2 border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 text-lg font-bold transition-colors">
                <button id="addBtn" class="bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600 text-white font-bold py-3 px-6 rounded-xl shadow-lg transform transition active:scale-95 flex items-center">
                    <i class="fa-solid fa-plus mr-2"></i> 加心願
                </button>
            </div>

            <!-- List area -->
            <ul id="wishList" class="space-y-3 mb-6">
                <!-- Items will be injected here by JS -->
            </ul>

            <!-- 傳送/分享按鈕 -->
            <div class="flex justify-center mt-6 pt-6 border-t-2 border-dashed border-gray-200">
                <button onclick="openShareModal()" class="bg-gradient-to-r from-green-400 to-emerald-500 hover:from-green-500 hover:to-emerald-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transform transition active:scale-95 flex items-center">
                    <i class="fa-solid fa-paper-plane mr-2 text-xl"></i> 匯出清單 Send 畀同事
                </button>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="text-center mt-12 text-gray-400 text-sm font-bold">
            <p>祝 <span class="name-display">Annie</span> 前程錦繡，日日有食神！🎉</p>
        </div>
    </div>

    <!-- Special Effect Overlay -->
    <div id="blessingEffect" class="blessing-effect flex flex-col items-center">
        <i class="fa-solid fa-circle-check text-6xl text-green-500 mb-4 animate-bounce"></i>
        <h2 class="text-3xl font-black text-blue-600 mb-2"><span class="name-display">Annie</span> 心願已了！</h2>
        <p class="text-2xl font-bold text-cyan-600 bg-yellow-200 px-4 py-2 rounded-lg transform -rotate-2">✨ 福到運來 ✨</p>
        <p class="mt-4 text-gray-600 font-bold" id="completedWishText"></p>
    </div>
    
    <!-- Share Modal (分享視窗) -->
    <div id="shareModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full mx-4 shadow-2xl transform scale-95 transition-transform" id="shareModalContent">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-black text-gray-800 flex items-center"><i class="fa-solid fa-share-nodes text-green-500 mr-2"></i> 傳送最新戰況</h3>
                <button onclick="closeShareModal()" class="text-gray-400 hover:text-gray-600 transition-colors"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>
            <p class="text-gray-600 text-sm font-bold mb-6">系統會將倒數時間同心願完成進度，自動變做文字 Send 出去！</p>
            <div class="space-y-3">
                <button onclick="shareWhatsApp()" class="w-full bg-[#25D366] hover:bg-[#128C7E] text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center transition-colors">
                    <i class="fa-brands fa-whatsapp text-xl mr-2"></i> WhatsApp 傳送
                </button>
                <button onclick="shareEmail()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-envelope text-xl mr-2"></i> Email 傳送
                </button>
                <button onclick="copyShareText()" id="copyBtn" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 px-4 rounded-xl flex items-center justify-center transition-colors">
                    <i class="fa-regular fa-copy text-xl mr-2"></i> 淨係複製文字
                </button>
            </div>
        </div>
    </div>

    <!-- Confetti Container -->
    <div id="confettiContainer" class="fixed inset-0 pointer-events-none z-50 overflow-hidden"></div>

    <script>
        // --- 待辦事項清單邏輯 ---
        
        const wishInput = document.getElementById('wishInput');
        const addBtn = document.getElementById('addBtn');
        const wishList = document.getElementById('wishList');
        const blessingEffect = document.getElementById('blessingEffect');
        const completedWishText = document.getElementById('completedWishText');
        const confettiContainer = document.getElementById('confettiContainer');

        // 預設清單 (搞笑版)
        let wishes = [
            { id: 1, text: '叫老細請食歡送飯 (要貴嘅) 🦞', completed: false },
            { id: 2, text: '清空自己個位啲雜物 (掉曬去隔離位) 🗑️', completed: false },
            { id: 3, text: '影低平時最憎個同事個衰樣留念 📸', completed: false },
            { id: 4, text: '大大聲講一句：「我唔撈啦！」 🗣️', completed: false }
        ];

        // 初始化渲染清單
        function renderWishes() {
            wishList.innerHTML = '';
            wishes.forEach(wish => {
                const li = document.createElement('li');
                li.className = `wish-item bg-gray-50 border-2 border-gray-100 rounded-xl p-4 flex items-center justify-between cursor-pointer ${wish.completed ? 'completed-item' : ''}`;
                
                // 左側內容 (Check圖標 + 文字)
                const contentDiv = document.createElement('div');
                contentDiv.className = 'flex items-center flex-1';
                
                const checkIcon = document.createElement('i');
                checkIcon.className = `fa-regular ${wish.completed ? 'fa-square-check text-green-500' : 'fa-square text-gray-400'} text-2xl mr-4`;
                
                const span = document.createElement('span');
                span.className = `text-lg font-bold ${wish.completed ? 'text-gray-400' : 'text-gray-700'}`;
                span.textContent = wish.text;

                contentDiv.appendChild(checkIcon);
                contentDiv.appendChild(span);

                // 右側刪除按鈕
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'text-gray-400 hover:text-red-500 transition-colors p-2 rounded-lg hover:bg-red-50';
                deleteBtn.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
                
                // 事件監聽
                contentDiv.onclick = () => toggleWish(wish.id);
                deleteBtn.onclick = (e) => {
                    e.stopPropagation(); // 阻止觸發完成事件
                    deleteWish(wish.id);
                };

                li.appendChild(contentDiv);
                li.appendChild(deleteBtn);
                wishList.appendChild(li);
            });
        }

        // 新增心願
        function addWish() {
            const text = wishInput.value.trim();
            if (text) {
                const newWish = {
                    id: Date.now(),
                    text: text,
                    completed: false
                };
                wishes.push(newWish);
                wishInput.value = '';
                renderWishes();
            } else {
                // 簡單提示替換 alert
                wishInput.placeholder = "喂！寫啲嘢先啦！";
                wishInput.classList.add('border-red-500');
                setTimeout(() => {
                    wishInput.placeholder = "例如：食爆 Pantry 啲零食、叫腦細請食飯...";
                    wishInput.classList.remove('border-red-500');
                }, 2000);
            }
        }

        // 切換完成狀態並觸發特效
        function toggleWish(id) {
            const wish = wishes.find(w => w.id === id);
            if (wish) {
                // 如果是從未完成變成完成，觸發特效
                if (!wish.completed) {
                    showBlessingEffect(wish.text);
                }
                wish.completed = !wish.completed;
                renderWishes();
            }
        }

        // 刪除心願
        function deleteWish(id) {
            wishes = wishes.filter(w => w.id !== id);
            renderWishes();
        }

        // --- 搞笑特效邏輯 ---
        function showBlessingEffect(wishText) {
            completedWishText.textContent = `「${wishText}」 已達成！`;
            blessingEffect.classList.add('active');
            createConfetti();
            
            // 3秒後隱藏特效
            setTimeout(() => {
                blessingEffect.classList.remove('active');
                confettiContainer.innerHTML = ''; // 清除紙屑
            }, 3000);
        }

        function createConfetti() {
            const colors = ['#f43f5e', '#ec4899', '#d946ef', '#a855f7', '#fbbf24', '#34d399', '#60a5fa'];
            confettiContainer.innerHTML = '';
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                
                // 隨機位置、顏色、大小、延遲
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                const size = Math.random() * 10 + 5; // 5px 到 15px
                confetti.style.width = size + 'px';
                confetti.style.height = size + 'px';
                
                // 隨機形狀 (圓形或方形)
                if (Math.random() > 0.5) {
                     confetti.style.borderRadius = '50%';
                }
                
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's'; // 2s 到 4s
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                
                confettiContainer.appendChild(confetti);
            }
        }

        // --- 分享與傳送邏輯 ---
        const shareModal = document.getElementById('shareModal');
        const shareModalContent = document.getElementById('shareModalContent');

        function openShareModal() {
            shareModal.classList.remove('hidden');
            // 觸發重繪以播放動畫
            void shareModal.offsetWidth;
            shareModal.classList.remove('opacity-0');
            shareModalContent.classList.remove('scale-95');
        }

        function closeShareModal() {
            shareModal.classList.add('opacity-0');
            shareModalContent.classList.add('scale-95');
            setTimeout(() => {
                shareModal.classList.add('hidden');
                document.getElementById('copyBtn').innerHTML = '<i class="fa-regular fa-copy text-xl mr-2"></i> 淨係複製文字';
                document.getElementById('copyBtn').classList.remove('bg-green-100', 'text-green-700');
            }, 300);
        }

        // 自動產生要分享的文字內容
        function generateShareText() {
            const heroName = document.getElementById('heroNameInput').value.trim() || 'Annie';
            const deptName = document.getElementById('deptNameInput').value.trim() || 'URS Office';
            const d = document.getElementById('days').textContent;
            const h = document.getElementById('hours').textContent;
            const m = document.getElementById('minutes').textContent;
            
            let text = `🎉【${heroName} 嘅 ${deptName} 逃脫計畫進度】🎉\n`;
            text += `⏳ 距離自由解放仲有：${d}日 ${h}小時 ${m}分鐘！\n\n`;
            text += `📝 調職前必做大清單：\n`;
            
            if (wishes.length === 0) {
                text += `(咦？暫時未有心願喎！)\n`;
            } else {
                wishes.forEach((wish) => {
                    const status = wish.completed ? '✅ (已了結！)' : '⬜';
                    text += `${status} ${wish.text}\n`;
                });
            }
            
            text += `\n✨ 祝 ${heroName} 前程錦繡，日日有食神！🏃‍♀️💨`;
            return text;
        }

        function shareWhatsApp() {
            const text = generateShareText();
            // 在新分頁打開 WhatsApp 網頁版或應用程式
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
            closeShareModal();
        }

        function shareEmail() {
            const text = generateShareText();
            const heroName = document.getElementById('heroNameInput').value.trim() || 'Annie';
            const subject = `[機密進度] ${heroName} 的心願要了清單！`;
            window.open(`mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`, '_blank');
            closeShareModal();
        }

        function copyShareText() {
            const text = generateShareText();
            const copyBtn = document.getElementById('copyBtn');
            
            // 建立一個臨時的 textarea 來複製文字 (兼容性最好)
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                copyBtn.innerHTML = '<i class="fa-solid fa-check text-green-500 text-xl mr-2"></i> 已經 Copy 咗啦！';
                copyBtn.classList.add('bg-green-100', 'text-green-700');
                
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="fa-regular fa-copy text-xl mr-2"></i> 淨係複製文字';
                    copyBtn.classList.remove('bg-green-100', 'text-green-700');
                    closeShareModal();
                }, 2000);
            } catch (err) {
                console.error('複製失敗', err);
            }
            document.body.removeChild(textArea);
        }

        // --- 倒數計時器邏輯 ---
        const targetDateInput = document.getElementById('targetDateInput');
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        
        const heroNameInput = document.getElementById('heroNameInput');
        const nameDisplays = document.querySelectorAll('.name-display');
        const deptNameInput = document.getElementById('deptNameInput');
        const deptDisplays = document.querySelectorAll('.dept-display');
        
        let timerInterval;

        // 預設 Last Day: 下個月底
        function getDefaultLastDay() {
            const now = new Date();
            const nextMonth = new Date(now.getFullYear(), now.getMonth() + 2, 0); // 下個月最後一天
            return nextMonth;
        }

        // 初始化日期輸入框
        function initDateInput() {
            const defaultDate = getDefaultLastDay();
            // 格式化為 YYYY-MM-DD 以便 input type="date" 使用
            const year = defaultDate.getFullYear();
            const month = String(defaultDate.getMonth() + 1).padStart(2, '0');
            const day = String(defaultDate.getDate()).padStart(2, '0');
            targetDateInput.value = `${year}-${month}-${day}`;
        }

        function updateCountdown() {
            // 取得輸入的日期，並設定時間為當天 18:00 (通常的下班時間)
            const targetDateStr = targetDateInput.value;
            const targetDate = new Date(`${targetDateStr}T18:00:00`);
            const now = new Date();
            
            const diff = targetDate - now;
            const currentHeroName = heroNameInput.value.trim() || 'Annie';

            if (diff <= 0) {
                clearInterval(timerInterval);
                daysEl.textContent = "00";
                hoursEl.textContent = "00";
                minutesEl.textContent = "00";
                secondsEl.textContent = "00";
                document.querySelector('.timer-box h2').textContent = `🎊 ${currentHeroName} 已經重獲自由啦！🎊`;
                document.querySelector('.timer-box h2').classList.add('text-blue-600', 'text-2xl', 'animate-pulse');
                return;
            }

            const d = Math.floor(diff / 1000 / 60 / 60 / 24);
            const h = Math.floor((diff / 1000 / 60 / 60) % 24);
            const m = Math.floor((diff / 1000 / 60) % 60);
            const s = Math.floor((diff / 1000) % 60);

            daysEl.textContent = String(d).padStart(2, '0');
            hoursEl.textContent = String(h).padStart(2, '0');
            minutesEl.textContent = String(m).padStart(2, '0');
            secondsEl.textContent = String(s).padStart(2, '0');
        }

        // --- 初始化事件 ---
        addBtn.addEventListener('click', addWish);
        wishInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addWish();
        });
        
        targetDateInput.addEventListener('change', () => {
             clearInterval(timerInterval);
             updateCountdown();
             timerInterval = setInterval(updateCountdown, 1000);
        });

        heroNameInput.addEventListener('input', () => {
            const newName = heroNameInput.value.trim() || 'Annie';
            nameDisplays.forEach(el => el.textContent = newName);
            // 確保倒數結束時，替換文字中的名字也會隨時更新
            updateCountdown(); 
        });

        deptNameInput.addEventListener('input', () => {
            const newDept = deptNameInput.value.trim() || 'URS Office';
            deptDisplays.forEach(el => el.textContent = newDept);
        });

        // 頁面加載完成後執行
        window.onload = () => {
            renderWishes();
            initDateInput();
            updateCountdown();
            timerInterval = setInterval(updateCountdown, 1000);
        };

    </script>
</body>
</html>
